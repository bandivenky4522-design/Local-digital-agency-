<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Local Digital Agency</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080d1c;
      color: #ffffff;
      line-height: 1.6;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      background: #0d1326;
      border-bottom: 1px solid #26314d;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #8d73ff;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      margin-left: 22px;
      font-size: 15px;
    }

    nav a:hover {
      color: #8d73ff;
    }

    .hero {
      text-align: center;
      padding: 80px 7%;
      background: radial-gradient(circle at center, #3d267d, transparent 60%);
    }

    .hero h1 {
      font-size: 52px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #8d73ff;
    }

    .hero p {
      color: #aeb8cc;
      font-size: 18px;
    }

    .contact-section {
      max-width: 1100px;
      margin: auto;
      padding: 60px 7%;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 35px;
    }

    .contact-info,
    .contact-form {
      background: #11182a;
      border: 1px solid #293551;
      border-radius: 18px;
      padding: 30px;
    }

    .contact-info h2,
    .contact-form h2 {
      margin-bottom: 15px;
    }

    .contact-info > p {
      color: #9faac0;
      margin-bottom: 25px;
    }

    .info-box {
      margin: 20px 0;
    }
