<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Local Digital Agency</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      line-height: 1.6;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 7%;
      background: #0b1020;
      border-bottom: 1px solid #27324c;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #8d73ff;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    nav a:hover {
      color: #8d73ff;
    }

    /* HERO */
    .hero {
      min-height: 88vh;
      display: flex;
      align-items: center;
      padding: 60px 7%;
      background:
        radial-gradient(circle at 80% 20%, #39227a, transparent 35%),
        #0b1020;
    }

    .hero-content {
      max-width: 750px;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      border: 1px solid #6651ad;
      border-radius: 30px;
      color: #c5b8ff;
      margin-bottom: 22px;
    }

    h1 {
      font-size: clamp(45px, 7vw, 78px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    h1 span {
      color: #8d73ff;
    }

    .hero p {
      color: #aeb8cc;
      font-size: 18px;
      margin-bottom: 32px;
      max-width: 650px;
    }

    /* BUTTONS */
    .btn {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin-right: 10px;
    }

    .primary {
      background: #7c5cff;
      color: white;
    }

    .secondary {
      border: 1px solid #46516c;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* SECTIONS */
    section {
      padding: 80px 7%;
    }

    .title {
      text-align: center;
      margin-bottom: 45px;
    }

    .title h2 {
      font-size: 38px;
    }

    .title p {
      color: #9da8bd;
      margin-top: 8px;
    }

    /* SERVICES */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      padding: 28px;
      background: #11182a;
      border: 1px solid #27324c;
      border-radius: 18px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #7c5cff;
    }

    .icon {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 21px;
    }

    .card p {
      color: #9da8bd;
    }

    /* PORTFOLIO */
    .portfolio-card {
      min-height: 170px;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 35px;
    }

    .stat {
      text-align: center;
      padding: 25px;
      background: #11182a;
      border: 1px solid #27324c;
      border-radius: 16px;
    }

    .stat strong {
      display: block;
      font-size: 30px;
      color: #a997ff;
    }

    /* CONTACT */
    .contact {
      text-align: center;
      background: #0f1627;
    }

    .contact p {
      color: #aeb8cc;
      max-width: 600px;
      margin: 10px auto 25px;
    }

    /* FOOTER */
    footer {
      text-align: center;
      padding: 25px;
      color: #7f8aa0;
      border-top: 1px solid #27324c;
    }

    /* MOBILE */
    @media (max-width: 800px) {

      nav {
        padding: 16px 5%;
      }

      nav div:last-child {
        display: none;
      }

      .hero {
        padding: 55px 5%;
      }

      section {
        padding: 60px 5%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      h1 {
        font-size: 48px;
      }
    }

      .stats
