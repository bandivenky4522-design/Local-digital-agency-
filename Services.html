<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services | Local Digital Agency</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      line-height: 1.6;
    }

    nav {
      padding: 20px 7%;
      background: #0b1020;
      border-bottom: 1px solid #27324c;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-right: 22px;
    }

    nav a:hover {
      color: #8d73ff;
    }

    .hero {
      text-align: center;
      padding: 85px 7%;
      background: radial-gradient(
        circle at center,
        #39227a,
        transparent 55%
      );
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #8d73ff;
    }

    .hero p {
      color: #aeb8cc;
      max-width: 700px;
      margin: auto;
      font-size: 18px;
    }

    .services {
      max-width: 1100px;
      margin: auto;
      padding: 70px 7%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

      background: #11182a;
      border: 1px solid #27324c;
      border-radius: 18px;
      padding: 30px;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #7c5cff;
    }

    .icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-bottom: 10px;
      font-size: 22px;
    }
